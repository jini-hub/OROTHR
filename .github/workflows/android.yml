name: Build OROT HR Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # setup-android@v3 tried to install the removed SDK package "tools".
      # Version 4 only installs supported Android SDK packages.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Build website
        run: npm run build

      - name: Generate native Android project
        run: npx cap add android

      - name: Sync native assets
        run: npx cap sync android

      - name: Apply OROT HR launcher icon
        run: npm run android:icons

      - name: Build Android debug and release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload installation/test APK
        uses: actions/upload-artifact@v6
        with:
          name: OROT-HR-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android-release.jks
            echo 'HAS_RELEASE_KEY=1' >> "$GITHUB_ENV"
          else
            echo 'Missing signing key: upload debug artifact only.'
          fi

      - name: Sign release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_RELEASE_KEY == '1'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          TOOL=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$TOOL" sign --ks android-release.jks --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out OROT-HR-release-signed.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$TOOL" verify OROT-HR-release-signed.apk

      - name: Publish signed release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_RELEASE_KEY == '1'
        uses: softprops/action-gh-release@v2
        with:
          files: OROT-HR-release-signed.apk
          generate_release_notes: true
